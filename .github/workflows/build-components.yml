name: Independent component builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
          TZ: UTC
        ports:
          - '127.0.0.1:13336:3306'
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      TZ: UTC
      MAVEN_OPTS: '-Xmx512m'
      V03_MYSQL: 'true'
      V03_MYSQL_USER: root
      V03_MYSQL_PASSWORD: ''
      V03_MYSQL_URL: 'jdbc:mysql://127.0.0.1:13336/fictional_v03_shared?serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true'
      V13_MYSQL_URL: 'jdbc:mysql://127.0.0.1:13336/fictional_v03_observations?serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true'
      B40_MYSQL_URL: 'jdbc:mysql://127.0.0.1:13336/fictional_v03_worker?serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true'
      B45_MYSQL: 'true'
      B45_MYSQL_URL: 'jdbc:mysql://127.0.0.1:13336/fictional_b45_inputs?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true'
      B51_MYSQL: 'true'
      B51_MYSQL_URL: 'jdbc:mysql://127.0.0.1:13336/fictional_b51_contents?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true'
      B44_MYSQL: 'true'
      B44_MYSQL_URL: 'jdbc:mysql://127.0.0.1:13336/fictional_b44_results?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true'
      B53_MYSQL: 'true'
      B53_MYSQL_URL: 'jdbc:mysql://127.0.0.1:13336/fictional_b53_reviews?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum
      - name: Prepare isolated native test databases
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --execute="SET GLOBAL time_zone='+00:00'; SET GLOBAL transaction_isolation='READ-COMMITTED'; SET GLOBAL event_scheduler=OFF;"
          for schema in fictional_v03_shared fictional_v03_observations fictional_v03_worker fictional_b45_inputs fictional_b51_contents fictional_b44_results fictional_b53_reviews; do
            docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --execute="CREATE DATABASE $schema CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          done
          printf 'V02_GO_EXEC=%s\n' "$(command -v go)" >> "$GITHUB_ENV"
      - name: Warm native Go interop compilation
        working-directory: collector
        run: |
          go mod download
          go test ./internal/outbox -run '^$'
      - name: Build and test backend
        working-directory: backend
        run: mvn -B --no-transfer-progress -Duser.timezone=UTC '-DargLine=-Xms128m -Xmx4096m -XX:MaxMetaspaceSize=512m' verify
      - name: Preserve backend test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
      - name: Package backend without runtime configuration
        run: |
          python3 deploy/package.py backend \
            --input backend/target/site-backend-0.1.0-SNAPSHOT.jar \
            --output artifacts \
            --version "0.1.0-${GITHUB_SHA:0:12}" \
            --source-commit "$GITHUB_SHA" \
            --build-id "$GITHUB_RUN_ID" \
            --toolchain jdk21-maven
      - uses: actions/upload-artifact@v5
        with:
          name: backend-build
          path: artifacts/backend/
          if-no-files-found: error

  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum
      - name: Test collector
        working-directory: collector
        run: go test ./...
      - name: Build linux/amd64 collector
        working-directory: collector
        run: |
          mkdir -p ../build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' \
            -o ../build/collector-linux-amd64 ./cmd/collector
      - name: Package collector without runtime configuration
        run: |
          python3 deploy/package.py collector \
            --input build/collector-linux-amd64 \
            --output artifacts \
            --version "0.1.0-${GITHUB_SHA:0:12}" \
            --source-commit "$GITHUB_SHA" \
            --build-id "$GITHUB_RUN_ID" \
            --toolchain go1.27.1-cgo0
      - uses: actions/upload-artifact@v5
        with:
          name: collector-build
          path: artifacts/collector/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test artifact boundary
        run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Fingerprint and package frontend
        run: |
          python3 deploy/package.py frontend \
            --input frontend/dist \
            --output artifacts \
            --version "0.1.0-${GITHUB_SHA:0:12}" \
            --source-commit "$GITHUB_SHA" \
            --build-id "$GITHUB_RUN_ID" \
            --toolchain node24.19-npm11.17
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: artifacts/frontend/
          if-no-files-found: error
